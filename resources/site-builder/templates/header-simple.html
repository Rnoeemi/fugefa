<header
  class="ts-header-simple site-nav is-solid"
  data-site-nav
  data-gjs-type="ts-header-simple"
  data-gjs-name="Egyszerű fejléc"
  data-brand="{{brand}}"
  data-logo-url="{{logo_url}}"
  data-logo-height="{{logo_height}}"
  data-logo-max-width="{{logo_max_width}}"
  data-menu-breakpoint="{{menu_breakpoint}}"
  style="--ts-logo-height:{{logo_height}}px;--ts-logo-max-width:{{logo_max_width}}px"
>
  <div class="ts-header-simple__inner ts-nav-inner">
    <a class="ts-nav-brand" href="/">
      <img class="ts-nav-logo" data-ts-logo data-ts-src-from="logo_url" src="{{logo_url}}" alt="{{brand}}">
      <span class="ts-nav-brand-text" data-ts-text="brand" data-ts-brand-text>{{brand}}</span>
    </a>
    <nav class="ts-nav-links" data-ts-menu-slot="primary">
      <span class="ts-menu-placeholder" data-ts-menu-primary data-gjs-name="Menü" data-gjs-editable="false" data-gjs-removable="false" data-gjs-copyable="false" data-gjs-draggable="false" data-gjs-highlightable="true">Menü</span>
    </nav>
    <button type="button" class="ts-nav-toggle" data-nav-toggle aria-label="Menü megnyitása" aria-expanded="false">
      <span class="ts-nav-toggle__icon" aria-hidden="true"></span>
    </button>
  </div>
  <div class="ts-nav-panel" data-nav-panel hidden>
    <div class="ts-nav-panel__inner" data-ts-menu-slot="primary-mobile">
      <span class="ts-menu-placeholder" data-ts-menu-primary-mobile data-gjs-name="Mobil menü" data-gjs-editable="false" data-gjs-removable="false" data-gjs-copyable="false" data-gjs-draggable="false" data-gjs-highlightable="true">Mobil menü</span>
    </div>
  </div>
</header>
<style>
.ts-header-simple{background:var(--color-primary);color:#fff;font-family:var(--font-sans,Karla,sans-serif);position:relative;z-index:40}
.ts-header-simple__inner{max-width:72rem;margin:0 auto;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.ts-nav-brand{display:inline-flex;align-items:center;gap:.75rem;color:inherit;text-decoration:none;font-family:var(--font-display,Literata,serif);font-size:1.35rem;min-width:0}
.ts-nav-logo{display:none;height:var(--ts-logo-height,2.5rem);width:auto;max-width:var(--ts-logo-max-width,11rem);object-fit:contain}
.ts-header-simple.has-logo .ts-nav-logo{display:block}
.ts-header-simple.has-logo .ts-nav-brand-text{display:none}
.ts-nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem}
.ts-nav-links a,.ts-nav-links .nav-link{color:inherit;text-decoration:none;font-size:.9rem;opacity:.9}
.ts-nav-links a:hover,.ts-nav-links .nav-link:hover{opacity:1}
.ts-nav-toggle{display:none;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;padding:0;border:1px solid color-mix(in srgb, currentColor 40%, transparent);background:transparent;color:inherit;cursor:pointer;border-radius:.25rem}
.ts-nav-toggle__icon,.ts-nav-toggle__icon:before,.ts-nav-toggle__icon:after{display:block;width:1.15rem;height:2px;background:currentColor;position:relative;transition:transform .2s ease,opacity .2s ease}
.ts-nav-toggle__icon:before,.ts-nav-toggle__icon:after{content:"";position:absolute;left:0}
.ts-nav-toggle__icon:before{top:-6px}
.ts-nav-toggle__icon:after{top:6px}
.ts-nav-toggle.is-open .ts-nav-toggle__icon{background:transparent}
.ts-nav-toggle.is-open .ts-nav-toggle__icon:before{top:0;transform:rotate(45deg)}
.ts-nav-toggle.is-open .ts-nav-toggle__icon:after{top:0;transform:rotate(-45deg)}
.ts-nav-panel{display:none;border-top:1px solid color-mix(in srgb, currentColor 12%, transparent);background:color-mix(in srgb, var(--color-primary) 92%, black);color:inherit}
.ts-nav-panel.is-open{display:block}
.ts-nav-panel__inner{display:flex;flex-direction:column;gap:1rem;padding:1rem 1.5rem 1.25rem;max-width:72rem;margin:0 auto}
.ts-nav-panel__inner a,.ts-nav-panel__link{color:inherit;text-decoration:none;font-size:1rem;opacity:.95}
.ts-menu-placeholder{display:inline-flex;align-items:center;padding:.45rem .85rem;border:1px dashed color-mix(in srgb, currentColor 50%, transparent);border-radius:.25rem;opacity:.8;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;user-select:none;pointer-events:none;color:inherit}
@media (max-width:767px){
  .ts-header-simple[data-menu-breakpoint="phone"] .ts-nav-links,
  .ts-header-simple:not([data-menu-breakpoint]) .ts-nav-links{display:none}
  .ts-header-simple[data-menu-breakpoint="phone"] .ts-nav-toggle,
  .ts-header-simple:not([data-menu-breakpoint]) .ts-nav-toggle{display:inline-flex}
}
@media (max-width:1023px){
  .ts-header-simple[data-menu-breakpoint="tablet"] .ts-nav-links{display:none}
  .ts-header-simple[data-menu-breakpoint="tablet"] .ts-nav-toggle{display:inline-flex}
}
</style>
