<section
  class="ts-hero"
  data-gjs-type="ts-hero"
  data-gjs-name="Hero"
  data-layout="{{layout}}"
  data-media-type="{{media_type}}"
  data-media-url="{{media_url}}"
  data-overlay="{{overlay}}"
  data-overlay-color="{{overlay_color}}"
  data-eyebrow="{{eyebrow}}"
  data-title="{{title}}"
  data-lead="{{lead}}"
  data-primary-label="{{primary_label}}"
  data-primary-href="{{primary_href}}"
  data-primary-style="{{primary_style}}"
  data-secondary-label="{{secondary_label}}"
  data-secondary-href="{{secondary_href}}"
  data-secondary-style="{{secondary_style}}"
>
  <div class="ts-hero__media" aria-hidden="true">
    <img class="ts-hero__img" data-ts-bg-image data-ts-hero-image src="{{media_url}}" alt="">
    <video class="ts-hero__video" data-ts-bg-video data-ts-hero-video autoplay muted loop playsinline poster="">
      <source data-ts-bg-source data-ts-hero-source src="{{media_url}}" type="video/mp4">
    </video>
  </div>
  <div class="ts-hero__overlay" data-ts-bg-overlay data-ts-hero-overlay style="opacity:{{overlay}}"></div>
  <div class="ts-hero__inner">
    <p class="ts-hero__eyebrow" data-ts-text="eyebrow">{{eyebrow}}</p>
    <h1 class="ts-hero__title" data-ts-text="title">{{title}}</h1>
    <p class="ts-hero__lead" data-ts-text="lead">{{lead}}</p>
    <div class="ts-hero__actions">
      <a class="ts-btn ts-btn--primary" data-ts-btn="primary_style" data-ts-text="primary_label" data-ts-href="primary_href" href="{{primary_href}}">{{primary_label}}</a>
      <a class="ts-btn ts-btn--inverse" data-ts-btn="secondary_style" data-ts-text="secondary_label" data-ts-href="secondary_href" href="{{secondary_href}}">{{secondary_label}}</a>
    </div>
  </div>
</section>
<style>
.ts-hero{position:relative;isolation:isolate;overflow:hidden;min-height:72vh;display:flex;align-items:flex-end;padding:7rem var(--section-x,1.5rem) 4.5rem;background:var(--color-primary);color:#fff;font-family:var(--font-sans,Karla,sans-serif)}
.ts-hero__media{position:absolute!important;inset:0!important;z-index:0!important}
.ts-hero__img,.ts-hero__video{width:100%;height:100%;object-fit:cover;display:none}
.ts-hero[data-media-type="image"] .ts-hero__img{display:block}
.ts-hero[data-media-type="video"] .ts-hero__video{display:block}
.ts-hero__overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 28%, transparent) 0%,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 78%, transparent) 70%,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 94%, transparent) 100%);pointer-events:none}
.ts-hero__inner{position:relative;z-index:2;max-width:var(--content-max,72rem);width:100%;margin:0 auto;box-sizing:border-box}
.ts-hero__eyebrow{letter-spacing:.18em;text-transform:uppercase;opacity:.7;font-size:.75rem;margin:0}
.ts-hero__title{font-family:var(--font-display,Literata,serif);font-size:clamp(2.5rem,5vw,4rem);margin:1rem 0;line-height:1.1}
.ts-hero__lead{max-width:36rem;opacity:.85;line-height:1.6;margin:0}
.ts-hero__actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}
.ts-btn{display:inline-block;padding:.85rem 1.4rem;text-decoration:none;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ts-btn--primary{background:var(--btn-bg,var(--color-accent));color:var(--btn-fg,#fff)}
.ts-btn--ghost{border:1px solid var(--btn-ghost-border,color-mix(in srgb, var(--color-text) 20%, transparent));color:var(--btn-ghost-fg,var(--color-text))}

/* —— Elrendezések —— */
.ts-hero[data-layout="bottom"],
.ts-hero:not([data-layout]){align-items:flex-end;text-align:left}
.ts-hero[data-layout="bottom"] .ts-hero__inner,
.ts-hero:not([data-layout]) .ts-hero__inner{display:block}

.ts-hero[data-layout="center"]{align-items:center;text-align:center;padding-top:6rem;padding-bottom:6rem}
.ts-hero[data-layout="center"] .ts-hero__inner{display:flex;flex-direction:column;align-items:center}
.ts-hero[data-layout="center"] .ts-hero__lead{margin-left:auto;margin-right:auto}
.ts-hero[data-layout="center"] .ts-hero__actions{justify-content:center}
.ts-hero[data-layout="center"] .ts-hero__overlay{background:linear-gradient(180deg,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 45%, transparent) 0%,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 72%, transparent) 55%,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 88%, transparent) 100%)}

.ts-hero[data-media-type="image"] .ts-hero__img{
  transform-origin:60% 40%;
  will-change:transform;
  animation:ts-hero-kenburns 28s ease-in-out infinite alternate;
}
@media (max-width:1023px){
  .ts-hero[data-media-type="image"] .ts-hero__img{animation-duration:24s}
}
@media (max-width:767px){
  .ts-hero[data-media-type="image"] .ts-hero__img{animation-duration:20s}
}
@media (prefers-reduced-motion:reduce){
  .ts-hero[data-media-type="image"] .ts-hero__img{animation:none;will-change:auto}
}
@keyframes ts-hero-kenburns{
  from{transform:scale(1.06) translate(0,0)}
  to{transform:scale(1.16) translate(-2.2%,-1.4%)}
}

/* Osztott: bal = sima háttérszín, jobb = tiszta kép (overlay nélkül). Szöveg a tartalmi sávban, bal félben. */
.ts-hero[data-layout="split"]{align-items:center;padding-top:4.5rem;padding-bottom:4.5rem;min-height:min(72vh,40rem);background:var(--ts-overlay-color, var(--color-primary))}
.ts-hero[data-layout="split"] .ts-hero__media{inset:auto;top:0;right:0;bottom:0;left:50%;width:50%}
.ts-hero[data-layout="split"] .ts-hero__overlay{opacity:0;background:none}
.ts-hero[data-layout="split"] .ts-hero__inner{max-width:var(--content-max,72rem);width:100%;margin-left:auto;margin-right:auto;padding-right:max(1.25rem,50%);box-sizing:border-box}
@media (max-width:800px){
  .ts-hero[data-layout="split"]{padding:5rem var(--section-x,1.25rem) 3.5rem;align-items:flex-end}
  .ts-hero[data-layout="split"] .ts-hero__media{inset:0;width:auto;left:0}
  .ts-hero[data-layout="split"] .ts-hero__overlay{opacity:var(--ts-hero-overlay-opacity,0.85);background:linear-gradient(180deg,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 28%, transparent) 0%,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 78%, transparent) 70%,color-mix(in srgb, var(--ts-overlay-color, var(--color-primary)) 94%, transparent) 100%)}
  .ts-hero[data-layout="split"] .ts-hero__inner{max-width:var(--content-max,72rem);width:100%;padding-right:0}
}
</style>
