<section
  class="ts-features"
  data-gjs-type="ts-features"
  data-gjs-name="Előnyök"
  data-title="{{title}}"
  data-columns="{{columns}}"
>
  <div class="ts-features__inner">
    <h2 class="ts-features__title" data-ts-text="title">{{title}}</h2>
    <div class="ts-features__grid" data-ts-items="items" data-ts-items-kind="features"></div>
  </div>
</section>
<style>
.ts-features{padding:var(--section-y,4rem) max(var(--section-x),1.5rem);background:var(--color-light);color:var(--color-text);font-family:var(--font-sans,Karla,sans-serif);box-sizing:border-box}
.ts-features__inner{max-width:var(--content-max,72rem);margin:0 auto;width:100%;box-sizing:border-box}
.ts-features__title{font-family:var(--font-display,Literata,serif);font-size:var(--type-section-title-size, clamp(1.75rem,3vw,2.4rem));margin:0 0 2rem}
.ts-features__grid{display:grid;gap:1.5rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.ts-features[data-columns="2"] .ts-features__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ts-features[data-columns="3"] .ts-features__grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ts-features[data-columns="4"] .ts-features__grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.ts-feature{display:flex;flex-direction:column;gap:.65rem;min-width:0}
.ts-feature__icon{display:inline-flex;width:2.75rem;height:2.75rem;align-items:center;justify-content:center;color:var(--color-accent,var(--color-primary));flex-shrink:0;overflow:hidden;border-radius:var(--radius-control,.5rem)}
.ts-feature__icon svg{width:1.75rem;height:1.75rem;display:block}
.ts-feature__icon--media{width:3rem;height:3rem;padding:0}
.ts-feature__icon--media img{width:100%;height:100%;object-fit:cover;display:block}
.ts-feature__title{font-family:var(--font-display,Literata,serif);font-size:1.15rem;margin:0;line-height:1.3}
.ts-feature__text{margin:0;line-height:1.55;opacity:.88}
.ts-feature{padding:1.5rem;background:#fff;border:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);box-sizing:border-box}
.ts-feature h3,.ts-feature__title{margin:0 0 .5rem;font-size:1.1rem}
.ts-feature p,.ts-feature__text{margin:0;line-height:1.6;opacity:.8}
@media (max-width:900px){
  .ts-features[data-columns="4"] .ts-features__grid,
  .ts-features[data-columns="3"] .ts-features__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .ts-features__grid,
  .ts-features[data-columns="2"] .ts-features__grid,
  .ts-features[data-columns="3"] .ts-features__grid,
  .ts-features[data-columns="4"] .ts-features__grid{grid-template-columns:1fr}
}
</style>
