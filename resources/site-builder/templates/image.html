<figure
  class="ts-image"
  data-gjs-type="ts-image"
  data-gjs-name="Kép"
  data-media-url="{{media_url}}"
  data-alt="{{alt}}"
  data-href="{{href}}"
  data-fit="{{fit}}"
>
  <a class="ts-image__link" data-ts-href="href" href="{{href}}">
    <img data-ts-bg-image src="{{media_url}}" alt="{{alt}}" loading="lazy">
  </a>
</figure>
<style>
.ts-image{margin:0;padding:1rem 0;max-width:100%}
.ts-image__link{display:block;text-decoration:none;color:inherit}
.ts-image:not([data-href]) .ts-image__link,
.ts-image[data-href=""] .ts-image__link{pointer-events:none;cursor:default}
.ts-image img{display:block;width:100%;height:auto;max-height:16rem;object-fit:contain;border-radius:var(--radius-control,.55rem)}

/* Kitöltés oszlopban / szekcióban */
.ts-image[data-fit="cover"],
.ts-image.img-cover{padding:0;max-width:none}
.ts-image[data-fit="cover"] img,
.ts-image.img-cover img{height:100%;max-height:none;object-fit:cover;border-radius:0}
.ts-layout__col > .ts-image[data-fit="cover"],
.ts-layout__col > .ts-image.img-cover{height:100%;min-height:100%;display:flex;flex-direction:column;margin:0;padding:0!important}
.ts-layout__col > .ts-image[data-fit="cover"] .ts-image__link,
.ts-layout__col > .ts-image.img-cover .ts-image__link{flex:1 1 auto;height:100%;min-height:14rem}
.ts-layout__col > .ts-image[data-fit="cover"] img,
.ts-layout__col > .ts-image.img-cover img{width:100%;height:100%;max-height:none;object-fit:cover}
</style>
