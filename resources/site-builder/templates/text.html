<section class="ts-text" data-gjs-type="ts-text" data-gjs-name="Szöveg" data-layout="{{layout}}" data-title="{{title}}" data-body="{{body}}">
  <div class="ts-text__inner">
    <h2 data-ts-text="title">{{title}}</h2>
    <div class="ts-text__body" data-ts-text="body">{{body}}</div>
  </div>
</section>
<style>
.ts-text{padding:4rem 1.5rem;background:#fff;color:var(--color-text);font-family:var(--font-sans,Karla,sans-serif)}
.ts-text__inner{max-width:42rem;margin:0 auto}
.ts-text h2,.ts-text__title{font-family:var(--font-display,Literata,serif);font-size:var(--type-section-title-size, clamp(1.75rem,3vw,2.4rem));margin:0 0 1rem}
.ts-text p,.ts-text__body{margin:0;line-height:1.7;opacity:.85}
.ts-text__body > *:first-child{margin-top:0}
.ts-text__body > *:last-child{margin-bottom:0}
.ts-text__body p{margin:0 0 .85rem;line-height:1.7;opacity:inherit}
.ts-text__body p:last-child{margin-bottom:0}
</style>
