<section
  class="ts-buttons"
  data-gjs-type="ts-buttons"
  data-gjs-name="Gombok"
  data-title="{{title}}"
  data-primary-label="{{primary_label}}"
  data-primary-href="{{primary_href}}"
  data-primary-style="{{primary_style}}"
  data-secondary-label="{{secondary_label}}"
  data-secondary-href="{{secondary_href}}"
  data-secondary-style="{{secondary_style}}"
>
  <div class="ts-buttons__inner">
    <h2 data-ts-text="title">{{title}}</h2>
    <div class="ts-buttons__row">
      <a class="ts-btn ts-btn--primary" data-ts-btn="primary_style" data-ts-text="primary_label" data-ts-href="primary_href" href="{{primary_href}}">{{primary_label}}</a>
      <a class="ts-btn ts-btn--secondary" data-ts-btn="secondary_style" data-ts-text="secondary_label" data-ts-href="secondary_href" href="{{secondary_href}}">{{secondary_label}}</a>
    </div>
  </div>
</section>
<style>
.ts-buttons{padding:3rem 1.5rem;background:#fff;color:var(--color-text);font-family:var(--font-sans,Karla,sans-serif);text-align:center}
.ts-buttons__inner{max-width:40rem;margin:0 auto}
.ts-buttons h2{font-family:var(--font-display,Literata,serif);font-size:var(--type-section-title-size, clamp(1.75rem,3vw,2.4rem));margin:0 0 1.25rem}
.ts-buttons__row{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
.ts-btn{display:inline-block;padding:.85rem 1.4rem;text-decoration:none;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
</style>
