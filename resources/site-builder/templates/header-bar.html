<header
  class="site-nav is-solid"
  data-site-nav
  data-gjs-type="ts-header-bar"
  data-gjs-name="Fejléc"
  data-layout="{{layout}}"
  data-brand-align="{{brand_align}}"
  data-desktop-menu="{{desktop_menu}}"
  data-brand="{{brand}}"
  data-logo-url="{{logo_url}}"
  data-logo-height="{{logo_height}}"
  data-logo-max-width="{{logo_max_width}}"
  data-menu-align="{{menu_align}}"
  data-menu-breakpoint="{{menu_breakpoint}}"
  data-mobile-menu-style="{{mobile_menu_style}}"
  data-show-topbar="{{show_topbar}}"
  data-use-site-contact="{{use_site_contact}}"
  data-show-social-facebook="{{show_social_facebook}}"
  data-show-social-instagram="{{show_social_instagram}}"
  data-show-social-tiktok="{{show_social_tiktok}}"
  data-show-social-linkedin="{{show_social_linkedin}}"
  data-cta-label="{{cta_label}}"
  data-cta-href="{{cta_href}}"
  data-show-cta="{{show_cta}}"
  data-topbar-phone="{{topbar_phone}}"
  data-topbar-email="{{topbar_email}}"
  data-topbar-address="{{topbar_address}}"
  data-social-facebook-url="{{social_facebook_url}}"
  data-social-instagram-url="{{social_instagram_url}}"
  data-social-tiktok-url="{{social_tiktok_url}}"
  data-social-linkedin-url="{{social_linkedin_url}}"
  style="--ts-logo-height:{{logo_height}}px;--ts-logo-max-width:{{logo_max_width}}px"
>
  <div class="ts-nav-topbar" data-ts-topbar>
    <div class="ts-nav-topbar__inner">
      <div class="ts-nav-topbar__contact">
        <a class="ts-nav-topbar__item ts-nav-topbar__phone" data-ts-show="topbar_phone" data-ts-text="topbar_phone" data-ts-href="topbar_phone" href="#" data-ts-href-scheme="tel">Telefon</a>
        <a class="ts-nav-topbar__item ts-nav-topbar__email" data-ts-show="topbar_email" data-ts-text="topbar_email" data-ts-href="topbar_email" href="#" data-ts-href-scheme="mailto">E-mail</a>
        <span class="ts-nav-topbar__item ts-nav-topbar__address" data-ts-show="topbar_address" data-ts-text="topbar_address">Cím</span>
      </div>
      <div class="ts-nav-topbar__social">
        <a class="ts-nav-social ts-nav-social--facebook" data-ts-show="social_facebook" data-ts-href="social_facebook_url" href="{{social_facebook_url}}" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.027 4.388 11.026 10.125 11.926v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796v8.437C19.612 23.1 24 18.1 24 12.073z"/></svg>
        </a>
        <a class="ts-nav-social ts-nav-social--instagram" data-ts-show="social_instagram" data-ts-href="social_instagram_url" href="{{social_instagram_url}}" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        </a>
        <a class="ts-nav-social ts-nav-social--tiktok" data-ts-show="social_tiktok" data-ts-href="social_tiktok_url" href="{{social_tiktok_url}}" aria-label="TikTok" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        </a>
        <a class="ts-nav-social ts-nav-social--linkedin" data-ts-show="social_linkedin" data-ts-href="social_linkedin_url" href="{{social_linkedin_url}}" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 114.126 0 2.063 2.063 0 01-2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="ts-nav-inner">
    <a class="ts-nav-brand" href="/">
      <img class="ts-nav-logo" data-ts-logo data-ts-src-from="logo_url" src="{{logo_url}}" alt="{{brand}}">
      <span class="ts-nav-brand-text" data-ts-text="brand" data-ts-brand-text>{{brand}}</span>
    </a>
    <div class="ts-nav-bar">
      <nav class="ts-nav-links" data-ts-menu-slot="primary">
        <span class="ts-menu-placeholder" data-ts-menu-primary data-gjs-name="Menü" data-gjs-editable="false" data-gjs-removable="false" data-gjs-copyable="false" data-gjs-draggable="false" data-gjs-highlightable="true">Menü</span>
      </nav>
      <div class="ts-nav-actions">
        <a class="ts-nav-cta ts-btn ts-btn--primary" data-ts-text="cta_label" data-ts-href="cta_href" href="{{cta_href}}">{{cta_label}}</a>
        <button type="button" class="ts-nav-toggle" data-nav-toggle aria-label="Menü megnyitása" aria-expanded="false">
          <span class="ts-nav-toggle__icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
  <div class="ts-nav-overlay" data-nav-overlay hidden aria-hidden="true"></div>
  <div class="ts-nav-panel" data-nav-panel aria-hidden="true">
    <div class="ts-nav-panel__head">
      <p class="ts-nav-panel__title" data-ts-text="brand">{{brand}}</p>
      <button type="button" class="ts-nav-panel__close" data-nav-close aria-label="Menü bezárása">
        <span class="ts-nav-panel__close-icon" aria-hidden="true"></span>
      </button>
    </div>
    <div class="ts-nav-panel__body">
      <nav class="ts-nav-panel__menu" data-ts-menu-slot="primary-mobile">
        <span class="ts-menu-placeholder" data-ts-menu-primary-mobile data-gjs-name="Mobil menü" data-gjs-editable="false" data-gjs-removable="false" data-gjs-copyable="false" data-gjs-draggable="false" data-gjs-highlightable="true">Mobil menü</span>
      </nav>
      <div class="ts-nav-panel__foot">
        <a class="ts-nav-cta ts-nav-cta--panel ts-btn ts-btn--primary" data-ts-text="cta_label" data-ts-href="cta_href" href="{{cta_href}}">{{cta_label}}</a>
      </div>
    </div>
  </div>
</header>
<style>
.site-nav{background:#fff;color:#3d3d3d;font-family:var(--font-sans,Karla,sans-serif);position:relative;z-index:40;border-bottom:1px solid #ececec}
.site-nav.has-logo{background:#fff;color:#3d3d3d;border-bottom-color:#ececec}
.site-nav.has-logo .ts-nav-links a,.site-nav.has-logo .ts-nav-links .nav-link{color:inherit}
.ts-nav-inner{max-width:72rem;margin:0 auto;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem}
.ts-nav-brand{display:inline-flex;align-items:center;gap:.75rem;font-family:var(--font-display,Literata,serif);font-size:1.5rem;color:inherit;text-decoration:none;min-width:0;flex-shrink:0}
.ts-nav-logo{display:none;height:var(--ts-logo-height,2.5rem);width:auto;max-width:var(--ts-logo-max-width,11rem);object-fit:contain}
.site-nav.has-logo .ts-nav-logo{display:block}
.site-nav.has-logo .ts-nav-brand-text{display:none}
.ts-nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem;margin-left:auto}
.site-nav[data-menu-align="left"] .ts-nav-links{margin-left:0;order:2}
.site-nav[data-menu-align="left"] .ts-nav-brand{order:1}
.site-nav[data-menu-align="left"] .ts-nav-actions{order:3;margin-left:auto}
.site-nav[data-menu-align="right"] .ts-nav-actions{margin-left:0}
.ts-nav-actions{display:flex;align-items:center;gap:.75rem;margin-left:auto;flex-shrink:0}
.ts-nav-links a,.ts-nav-links .nav-link{color:inherit;text-decoration:none;font-size:.9rem;opacity:.9}
.ts-nav-links a:hover,.ts-nav-links .nav-link:hover{opacity:1}
.ts-nav-cta{display:inline-flex;align-items:center;background:var(--btn-bg,var(--color-accent));color:var(--btn-fg,#fff)!important;padding:.65rem 1rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;text-decoration:none;white-space:nowrap;border-radius:var(--radius-control,.55rem)}
.site-nav[data-show-cta="1"] .ts-nav-cta:not(.ts-nav-cta--panel){display:inline-flex}
.site-nav[data-show-cta="1"] .ts-nav-cta--panel{display:inline-flex}
.site-nav[data-show-cta="0"] .ts-nav-cta,
.site-nav:not([data-show-cta="1"]) .ts-nav-cta{display:none!important}
.site-nav[data-desktop-menu="hidden"] .ts-nav-links{display:none!important}
/* TS_HEADER_LAYOUT */
.ts-nav-topbar{display:none;border-bottom:1px solid color-mix(in srgb,currentColor 12%,transparent);font-size:.78rem}
.site-nav[data-show-topbar="1"] .ts-nav-topbar{display:block}
.ts-nav-topbar__inner{max-width:72rem;margin:0 auto;padding:.45rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.ts-nav-topbar__contact{display:flex;flex-wrap:wrap;align-items:center;gap:.85rem 1.25rem;opacity:.88}
.ts-nav-topbar__item{color:inherit;text-decoration:none}
.ts-nav-topbar__item:empty{display:none}
a.ts-nav-topbar__item:hover{opacity:1;text-decoration:underline}
.ts-nav-topbar__social{display:flex;align-items:center;gap:.55rem}
.ts-nav-social{display:inline-flex;align-items:center;justify-content:center;width:1.85rem;height:1.85rem;color:inherit;opacity:.85;text-decoration:none;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 28%,transparent)}
.ts-nav-social svg{width:1rem;height:1rem;display:block}
.ts-nav-social:hover{opacity:1}
.site-nav[data-desktop-menu="hidden"] .ts-nav-toggle,
.site-nav[data-layout="minimal"] .ts-nav-toggle{display:inline-flex!important}
.ts-nav-bar{display:contents}
.ts-nav-links{margin-left:auto}
.site-nav[data-menu-align="left"] .ts-nav-links{margin-left:0;order:2}
.site-nav[data-menu-align="left"] .ts-nav-brand{order:1}
.site-nav[data-menu-align="left"] .ts-nav-actions{order:3;margin-left:auto}
.site-nav[data-menu-align="right"] .ts-nav-links,
.site-nav:not([data-menu-align="left"]) .ts-nav-links{margin-left:auto}
.site-nav[data-menu-align="right"] .ts-nav-actions,
.site-nav:not([data-menu-align="left"]) .ts-nav-actions{margin-left:0}
.ts-nav-actions{display:flex;align-items:center;gap:.75rem;margin-left:auto;flex-shrink:0}
.site-nav[data-brand-align="center"] .ts-nav-inner{display:flex;flex-wrap:nowrap;justify-content:space-between}
.site-nav[data-brand-align="center"] .ts-nav-brand{flex:1;justify-content:center;min-width:0;grid-column:unset;justify-self:unset}
.site-nav[data-brand-align="center"] .ts-nav-links{grid-column:unset;justify-self:unset}
.site-nav[data-brand-align="center"] .ts-nav-actions{grid-column:unset;justify-self:unset}
.site-nav[data-brand-align="center"] .ts-nav-bar{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
@media (min-width:768px){
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-inner,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-inner{flex-direction:column;align-items:center;gap:.65rem}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-brand,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-brand{flex:none;justify-content:center;width:100%}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-bar,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1rem 1.5rem;width:100%}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-links,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-links{margin-left:0;justify-content:center}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-actions,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-actions{margin-left:0}
}
@media (min-width:1024px){
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-inner{flex-direction:column;align-items:center;gap:.65rem}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-brand{flex:none;justify-content:center;width:100%}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1rem 1.5rem;width:100%}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-links{margin-left:0;justify-content:center}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-actions{margin-left:0}
}
@media (max-width:767px){
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-inner,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-inner{flex-direction:row;align-items:center}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-brand,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-brand{flex:1;justify-content:flex-start}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="phone"] .ts-nav-bar,
  .site-nav[data-brand-align="center"]:not([data-menu-breakpoint]) .ts-nav-bar{width:auto;margin-left:auto}
}
@media (max-width:1023px){
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-inner{flex-direction:row;align-items:center}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-brand{flex:1;justify-content:flex-start}
  .site-nav[data-brand-align="center"][data-menu-breakpoint="tablet"] .ts-nav-bar{width:auto;margin-left:auto}
}
.site-nav .ts-nav-topbar__social .ts-nav-social--facebook,
.site-nav .ts-nav-topbar__social .ts-nav-social--instagram,
.site-nav .ts-nav-topbar__social .ts-nav-social--tiktok,
.site-nav .ts-nav-topbar__social .ts-nav-social--linkedin{display:none!important}
.site-nav[data-show-social-facebook="1"] .ts-nav-social--facebook,
.site-nav[data-show-social-instagram="1"] .ts-nav-social--instagram,
.site-nav[data-show-social-tiktok="1"] .ts-nav-social--tiktok,
.site-nav[data-show-social-linkedin="1"] .ts-nav-social--linkedin{display:inline-flex!important}
.site-nav:not([data-show-social-facebook="1"]):not([data-show-social-instagram="1"]):not([data-show-social-tiktok="1"]):not([data-show-social-linkedin="1"]) .ts-nav-topbar__social{display:none!important}
/* END TS_HEADER_LAYOUT */
.ts-nav-toggle{display:none;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;padding:0;border:1px solid color-mix(in srgb,currentColor 40%,transparent);background:transparent;color:inherit;cursor:pointer;border-radius:.25rem;flex-shrink:0}
.ts-nav-toggle__icon,.ts-nav-toggle__icon:before,.ts-nav-toggle__icon:after{display:block;width:1.15rem;height:2px;background:currentColor;position:relative;transition:transform .2s ease,opacity .2s ease}
.ts-nav-toggle__icon:before,.ts-nav-toggle__icon:after{content:"";position:absolute;left:0}
.ts-nav-toggle__icon:before{top:-6px}
.ts-nav-toggle__icon:after{top:6px}
.ts-nav-toggle.is-open .ts-nav-toggle__icon{background:transparent}
.ts-nav-toggle.is-open .ts-nav-toggle__icon:before{top:0;transform:rotate(45deg)}
.ts-nav-toggle.is-open .ts-nav-toggle__icon:after{top:0;transform:rotate(-45deg)}

/* TS_MOBILE_MENU_V2 */
.site-nav{--ts-nav-drawer-width:min(20rem,90vw);--ts-nav-overlay-bg:rgba(8,12,22,.55)}
.site-nav.is-menu-open{z-index:10000}
.site-nav.is-menu-open .ts-nav-actions,.site-nav.is-menu-open .ts-nav-toggle{position:relative;z-index:101;pointer-events:auto}
.ts-nav-overlay{position:fixed;inset:0;z-index:1;background:var(--ts-nav-overlay-bg);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .32s ease,visibility .32s ease}
.site-nav.is-menu-open .ts-nav-overlay.is-open{opacity:1;visibility:visible;pointer-events:auto}
.site-nav[data-mobile-menu-style="dropdown"] .ts-nav-overlay{display:none!important}

.ts-nav-panel{position:relative;z-index:2;color:inherit;box-sizing:border-box}
header.site-nav:not(.is-menu-open) .ts-nav-panel,
header.site-nav:not(.is-menu-open) .ts-nav-overlay{
  display:none!important;
  pointer-events:none!important;
}
.ts-nav-panel__head{display:none;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0}
.ts-nav-panel__title{margin:0;font-family:var(--font-display,Literata,serif);font-size:1.15rem;line-height:1.2;opacity:.92}
.ts-nav-panel__close{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;padding:0;border:1px solid color-mix(in srgb,currentColor 28%,transparent);background:color-mix(in srgb,currentColor 6%,transparent);color:inherit;border-radius:999px;cursor:pointer;flex-shrink:0;transition:background .2s ease,transform .2s ease}
.ts-nav-panel__close:hover{background:color-mix(in srgb,currentColor 14%,transparent)}
.ts-nav-panel__close-icon{display:block;width:1.15rem;height:2px;background:transparent;position:relative}
.ts-nav-panel__close-icon:before,.ts-nav-panel__close-icon:after{display:block;width:1.15rem;height:2px;background:currentColor;content:"";position:absolute;left:0;top:0;transition:transform .2s ease}
.ts-nav-panel__close-icon:before{transform:rotate(45deg)}
.ts-nav-panel__close-icon:after{transform:rotate(-45deg)}
.ts-nav-panel__body{display:flex;flex-direction:column;gap:0;min-height:0;width:100%;box-sizing:border-box}
.ts-nav-panel__menu{display:flex;flex-direction:column;gap:0;min-height:0}
.ts-nav-panel__menu a,.ts-nav-panel__link{display:block;color:inherit;text-decoration:none;transition:color .2s ease,background .2s ease,transform .25s ease,opacity .25s ease,border-color .2s ease}
.ts-nav-panel__foot{padding-top:1rem;margin-top:auto}

/* —— 1. Legördülő (accordion a fejléc alatt) —— */
.site-nav[data-mobile-menu-style="dropdown"] .ts-nav-panel{position:relative;z-index:40;overflow:hidden;max-height:0;border-top:0 solid color-mix(in srgb,currentColor 14%,transparent);background:color-mix(in srgb,var(--color-primary) 94%,#000);transition:max-height .38s cubic-bezier(.4,0,.2,1),border-top-width .2s ease}
