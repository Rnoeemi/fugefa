<section
  class="ts-flipcards"
  data-gjs-type="ts-flipcards"
  data-gjs-name="Flipcard sor"
  data-title="{{title}}"
  data-columns="{{columns}}"
>
  <div class="ts-flipcards__inner">
    <h2 class="ts-flipcards__title" data-ts-text="title">{{title}}</h2>
    <div class="ts-flipcards__grid" data-ts-items="items" data-ts-items-kind="flipcards"></div>
  </div>
</section>
<style>
.ts-flipcards{padding:var(--section-y,3.5rem) max(var(--section-x),1.5rem);background:var(--color-surface,#fff);color:var(--color-text,#222);font-family:var(--font-sans,Karla,sans-serif);box-sizing:border-box}
.ts-flipcards__inner{max-width:var(--content-max,72rem);margin:0 auto;width:100%;box-sizing:border-box}
.ts-flipcards__title{font-family:var(--font-display,Literata,serif);font-size:var(--type-section-title-size,clamp(1.75rem,3vw,2.4rem));margin:0 0 1.75rem}
.ts-flipcards__title:empty{display:none}
.ts-flipcards__grid{display:grid;gap:1rem;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch}
.ts-flipcards[data-columns="2"] .ts-flipcards__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ts-flipcards[data-columns="3"] .ts-flipcards__grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ts-flipcards[data-columns="4"] .ts-flipcards__grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.ts-flipcard{min-width:0;aspect-ratio:1/1;perspective:1400px}
.ts-flipcard__scene{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.7,.2,1)}
.ts-flipcard[data-flip="1"].is-flipped .ts-flipcard__scene,
.ts-flipcard[data-flip="1"]:hover .ts-flipcard__scene,
.ts-flipcard[data-flip="1"]:focus-within .ts-flipcard__scene{transform:rotateY(180deg)}
@media (hover:none){
  .ts-flipcard[data-flip="1"]:hover .ts-flipcard__scene{transform:none}
  .ts-flipcard[data-flip="1"].is-flipped .ts-flipcard__scene{transform:rotateY(180deg)}
}
.ts-flipcard__face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.25rem;box-sizing:border-box;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-sm,.35rem);background:#fff;box-shadow:0 10px 28px rgb(0 0 0 / 8%);overflow:hidden;text-align:center}
.ts-flipcard__face--back{transform:rotateY(180deg);background:var(--color-light,#f7f7f7)}
.ts-flipcard[data-flip="0"] .ts-flipcard__face--back{display:none}
.ts-flipcard[data-flip="0"] .ts-flipcard__scene{transform:none!important}
.ts-flipcard__media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ts-flipcard__face:has(.ts-flipcard__media){padding:0;justify-content:flex-end;align-items:stretch}
.ts-flipcard__face:has(.ts-flipcard__media) .ts-flipcard__copy{position:relative;z-index:1;width:100%;padding:1rem 1.1rem;background:linear-gradient(180deg,transparent,rgb(0 0 0 / 62%));color:#fff;text-align:left}
.ts-flipcard__face:has(.ts-flipcard__media) .ts-flipcard__copy:empty{display:none}
.ts-flipcard__copy{position:relative;z-index:1;display:grid;gap:.55rem;max-width:18rem}
.ts-flipcard__title{margin:0;font-family:var(--font-sans,Karla,sans-serif);font-size:clamp(.82rem,1.5vw,.95rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.ts-flipcard__text{margin:0;font-size:.9rem;line-height:1.5;opacity:.82}
.ts-flipcard__face:has(.ts-flipcard__media) .ts-flipcard__text{opacity:.92}
.ts-flipcard[data-flip="1"]{cursor:pointer}
.ts-flipcard[data-flip="1"]:focus-visible{outline:2px solid var(--color-primary,#111);outline-offset:3px}
@media (max-width:1023px){
  .ts-flipcards[data-columns="4"] .ts-flipcards__grid,
  .ts-flipcards[data-columns="3"] .ts-flipcards__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .ts-flipcards__grid,
  .ts-flipcards[data-columns="2"] .ts-flipcards__grid,
  .ts-flipcards[data-columns="3"] .ts-flipcards__grid,
  .ts-flipcards[data-columns="4"] .ts-flipcards__grid{grid-template-columns:1fr;max-width:22rem;margin-inline:auto}
}
</style>
