<section
  class="ts-icon-list"
  data-gjs-type="ts-icon-list"
  data-gjs-name="Ikonlista"
  data-layout="{{layout}}"
  data-title="{{title}}"
  data-lead="{{lead}}"
  data-columns="{{columns}}"
>
  <div class="ts-icon-list__inner">
    <h2 class="ts-icon-list__title" data-ts-text="title">{{title}}</h2>
    <p class="ts-icon-list__lead" data-ts-text="lead">{{lead}}</p>
    <div class="ts-icon-list__grid" data-ts-items="items" data-ts-items-kind="icon-list"></div>
  </div>
</section>
<style>
.ts-icon-list{padding:var(--section-y,4rem) max(var(--section-x),1.5rem);background:var(--color-light);color:var(--color-text);font-family:var(--font-sans,Karla,sans-serif);box-sizing:border-box}
.ts-icon-list__inner{max-width:var(--content-max,72rem);margin:0 auto;width:100%;box-sizing:border-box}
.ts-icon-list__title{font-family:var(--font-display,Literata,serif);font-size:var(--type-section-title-size, clamp(1.75rem,3vw,2.4rem));margin:0 0 .75rem}
.ts-icon-list__lead{margin:0 0 2rem;max-width:40rem;opacity:.85;line-height:1.6}
.ts-icon-list__grid{display:grid;gap:1.5rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.ts-icon-list[data-columns="2"] .ts-icon-list__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ts-icon-list[data-columns="3"] .ts-icon-list__grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ts-icon-list[data-columns="4"] .ts-icon-list__grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.ts-icon-item{display:flex;flex-direction:column;gap:.65rem;min-width:0}
.ts-icon-item__icon{display:inline-flex;width:2.75rem;height:2.75rem;align-items:center;justify-content:center;color:var(--color-accent,var(--color-primary));flex-shrink:0;overflow:hidden;border-radius:var(--radius-control,.5rem)}
.ts-icon-item__icon svg{width:1.75rem;height:1.75rem;display:block}
.ts-icon-item__icon--media{width:3rem;height:3rem;padding:0}
.ts-icon-item__icon--media img{width:100%;height:100%;object-fit:cover;display:block}
.ts-icon-item__title{font-family:var(--font-display,Literata,serif);font-size:1.15rem;margin:0;line-height:1.3}
.ts-icon-item__text{margin:0;line-height:1.55;opacity:.88;font-size:.95rem}
.ts-icon-item__title a,.ts-icon-item__text a{color:inherit;text-decoration:underline;text-underline-offset:.12em}
@media (max-width:900px){
  .ts-icon-list[data-columns="4"] .ts-icon-list__grid,
  .ts-icon-list[data-columns="3"] .ts-icon-list__grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .ts-icon-list__grid,
  .ts-icon-list[data-columns="2"] .ts-icon-list__grid,
  .ts-icon-list[data-columns="3"] .ts-icon-list__grid,
  .ts-icon-list[data-columns="4"] .ts-icon-list__grid{grid-template-columns:1fr}
}
</style>
