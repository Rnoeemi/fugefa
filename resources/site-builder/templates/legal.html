<section
  class="ts-legal"
  data-gjs-type="ts-legal"
  data-gjs-name="Jogi szöveg"
  data-title="{{title}}"
  data-body="{{body}}"
>
  <div class="ts-legal__inner">
    <h2 data-ts-text="title">{{title}}</h2>
    <div class="ts-legal__body" data-ts-text="body">{{body}}</div>
  </div>
</section>
<style>
.ts-legal{padding:3rem 1.5rem;background:#fff;color:var(--color-text);font-family:var(--font-sans,Karla,sans-serif)}
.ts-legal__inner{max-width:48rem;margin:0 auto}
.ts-legal h2{font-family:var(--font-display,Literata,serif);font-size:1.5rem;margin:0 0 1rem}
.ts-legal__body{font-size:.95rem;line-height:1.7;opacity:.9}
.ts-legal__body p{margin:0 0 1rem}
.ts-legal__body p:last-child{margin-bottom:0}
.ts-legal__body ul,.ts-legal__body ol{margin:0 0 1rem;padding-left:1.25rem}
</style>
