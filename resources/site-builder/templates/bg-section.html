<section
  class="ts-bg-section"
  data-gjs-type="ts-bg-section"
  data-gjs-name="Háttérképes szekció"
  data-layout="{{layout}}"
  data-media-type="{{media_type}}"
  data-media-url="{{media_url}}"
  data-overlay="{{overlay}}"
  data-overlay-color="{{overlay_color}}"
  data-eyebrow="{{eyebrow}}"
  data-title="{{title}}"
  data-body="{{body}}"
  data-button-label="{{button_label}}"
  data-button-href="{{button_href}}"
  data-button-style="{{button_style}}"
>
  <div class="ts-bg-section__media" aria-hidden="true">
    <img data-ts-bg-image src="{{media_url}}" alt="">
    <video data-ts-bg-video autoplay muted loop playsinline>
      <source data-ts-bg-source src="{{media_url}}" type="video/mp4">
    </video>
  </div>
  <div class="ts-bg-section__overlay" data-ts-bg-overlay style="opacity:{{overlay}}"></div>
  <div class="ts-bg-section__inner">
    <p class="ts-bg-section__eyebrow" data-ts-text="eyebrow">{{eyebrow}}</p>
    <h2 data-ts-text="title">{{title}}</h2>
    <p class="ts-bg-section__body" data-ts-text="body">{{body}}</p>
    <a class="ts-btn ts-btn--primary" data-ts-btn="button_style" data-ts-text="button_label" data-ts-href="button_href" href="{{button_href}}">{{button_label}}</a>
  </div>
</section>
<style>
.ts-bg-section{position:relative;isolation:isolate;overflow:hidden;min-height:420px;display:flex;align-items:center;padding:4.5rem 1.5rem;color:#fff;font-family:var(--font-sans,Karla,sans-serif);background:var(--color-primary)}
.ts-bg-section__media{position:absolute;inset:0;z-index:0}
.ts-bg-section__media img,.ts-bg-section__media video{width:100%;height:100%;object-fit:cover;display:none}
.ts-bg-section[data-media-type="image"] .ts-bg-section__media img{display:block}
.ts-bg-section[data-media-type="video"] .ts-bg-section__media video{display:block}
.ts-bg-section__overlay{position:absolute;inset:0;z-index:1;background:var(--ts-overlay-color, var(--color-primary));pointer-events:none}
.ts-bg-section__inner{position:relative;z-index:2;max-width:40rem;width:100%;box-sizing:border-box}
.ts-bg-section__eyebrow{margin:0;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.ts-bg-section h2{font-family:var(--font-display,Literata,serif);font-size:clamp(2rem,4vw,3rem);margin:.75rem 0}
.ts-bg-section__body{margin:0 0 1.5rem;line-height:1.65;opacity:.88}
.ts-btn{display:inline-block;padding:.8rem 1.25rem;background:var(--btn-bg,var(--color-accent));color:var(--btn-fg,#fff);text-decoration:none;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}

.ts-bg-section[data-layout="left"],
.ts-bg-section:not([data-layout]){align-items:center;text-align:left}
.ts-bg-section[data-layout="center"]{align-items:center;text-align:center}
.ts-bg-section[data-layout="center"] .ts-bg-section__inner{max-width:42rem;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;align-items:center}
.ts-bg-section[data-layout="center"] .ts-bg-section__body{margin-left:auto;margin-right:auto}

.ts-bg-section[data-layout="split"]{align-items:center;background:var(--ts-overlay-color, var(--color-primary))}
.ts-bg-section[data-layout="split"] .ts-bg-section__media{inset:auto;top:0;right:0;bottom:0;left:50%;width:50%}
.ts-bg-section[data-layout="split"] .ts-bg-section__overlay{opacity:0;background:none}
.ts-bg-section[data-layout="split"] .ts-bg-section__inner{max-width:var(--content-max,72rem);width:100%;margin-left:auto;margin-right:auto;padding-right:max(1.25rem,50%);box-sizing:border-box}
@media (max-width:800px){
  .ts-bg-section[data-layout="split"] .ts-bg-section__media{inset:0;width:auto;left:0}
  .ts-bg-section[data-layout="split"] .ts-bg-section__overlay{opacity:var(--ts-bg-section-overlay-opacity,.55);background:var(--ts-overlay-color, var(--color-primary))}
  .ts-bg-section[data-layout="split"] .ts-bg-section__inner{max-width:40rem;padding-right:0}
}
</style>
